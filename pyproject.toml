[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-analyze"
version = "0.1.0"
description = "Multi-scanner stock analysis package (EP, VCP, BO)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openai>=2.16",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "tavily-python>=0.5.0",
    "questionary>=2.0.0",
    "rich>=13.0",
    "polygon-api-client>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["stock_analyze*"]
